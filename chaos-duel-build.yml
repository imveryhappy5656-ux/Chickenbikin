          function box(w,h,d,x,y,z,c,hp){const m=new T.Mesh(new T.BoxGeometry(w,h,d),MM(c));m.position.set(x,y,z);S.add(m);m.userData={b:new T.Box3().setFromCenterAndSize(m.position,V(w,h,d)),hp:hp||0};SO.push(m);return m}
