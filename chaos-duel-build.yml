          [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([a,b])=>{box(10,1,10,a*30,3.5,b*30,0xff6b9a);for(let i=0;i<4;i++)box(2,i+1,4,a*(24-(3-i)*2),(i+1)/2,b*30,0xffb0c8);box(3,5,3,a*18,2.5,b*18,0xff8a3d)})}
