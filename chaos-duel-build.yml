          for(let i=0;i<30;i++){const h=20+rnd()*50,a=i/30*6.28,r=(br?140:75)+rnd()*35,m=new T.Mesh(new T.BoxGeometry(10,h,10),MM(0x8aa0d0+(rnd()*32|0)*0x101));m.position.set(Math.cos(a)*r,-h/2-8,Math.sin(a)*r);dec(m)}}
