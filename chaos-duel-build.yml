          if(br){SP.push([0,0]);const bc=new T.Mesh(new T.CylinderGeometry(.6,.6,120,8),new T.MeshBasicMaterial({color:0xffd23f}));bc.position.y=60;dec(bc);
          for(let i=0;i<16;i++){const a=rnd()*6.283,r=10+rnd()*80;house(Math.cos(a)*r,Math.sin(a)*r)}
          for(let i=0;i<20;i++){const h=3+rnd()*9;box(3+rnd()*5,h,3+rnd()*5,(rnd()-.5)*190,h/2,(rnd()-.5)*190,0x7a6bd6+(rnd()*40|0)*0x100)}
          for(let i=0;i<24;i++)box(4+rnd()*6,1.6,1,(rnd()-.5)*190,.8,(rnd()-.5)*190,0x8855ff);
