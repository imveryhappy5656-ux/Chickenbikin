name: Build Chaos Duel APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project, bundle game, build APK
        run: |
          set -e
          mkdir -p app/src/main/java/com/chaosduel/game app/src/main/assets app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'ChaosDuel'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.chaosduel.game'
            compileSdk 34
            defaultConfig { applicationId 'com.chaosduel.game'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Chaos Duel" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:hardwareAccelerated="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode" android:launchMode="singleTask">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/chaosduel/game/MainActivity.java <<'EOF'
          package com.chaosduel.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView w;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              w = new WebView(this);
              w.setBackgroundColor(Color.parseColor("#112233"));
              w.setOverScrollMode(View.OVER_SCROLL_NEVER);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient());
              setContentView(w);
              hideBars();
              w.loadUrl("file:///android_asset/index.html");
            }

            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            @Override protected void onPause() { super.onPause(); w.onPause(); }
            @Override protected void onResume() { super.onResume(); w.onResume(); }

            @Override public void onBackPressed() {
              w.evaluateJavascript("(function(){try{if(G.run&&!G.pz){pause();return 'ok'}if(G.pz)return 'ok';return 'exit'}catch(e){return 'exit'}})()", r -> {
                if (r != null && r.contains("exit")) finish();
              });
            }
          }
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icbg"/>
            <foreground android:drawable="@drawable/icfg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="icbg">#2B5CFF</color></resources>
          EOF
          cat > app/src/main/res/drawable/icfg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFD23F" android:pathData="M84,54L68.7,62.5L69,80L54,71L39,80L39.3,62.5L24,54L39.3,45.5L39,28L54,37L69,28L68.7,45.5Z"/>
            <path android:fillColor="#FFE0BD" android:pathData="M40,56a14,14 0 1,0 28,0a14,14 0 1,0 -28,0Z"/>
            <path android:fillColor="#111111" android:pathData="M46.8,54a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0Z M56.8,54a2.2,2.2 0 1,0 4.4,0a2.2,2.2 0 1,0 -4.4,0Z"/>
          </vector>
          EOF
          cat > app/src/main/assets/index.html <<'GAMEEOF'
          <!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content="Chaos Duel"><meta name=theme-color content="#2b5cff"><title>Chaos Duel</title>
          <style>
          *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
          html,body{height:100%}body{margin:0;overflow:hidden;overscroll-behavior:none;background:#123;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
          canvas{display:block}
          #hud{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
          .bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));width:34%;height:16px;background:#0007;border:2px solid #fff;border-radius:9px;overflow:hidden}
          .bar i{display:block;height:100%;width:100%;background:#4f6}
          #bA{left:10px}#bE{right:10px}#bE i{background:#f55}
          #sc{position:absolute;top:calc(34px + env(safe-area-inset-top,0px));width:100%;text-align:center;font:bold 18px system-ui;text-shadow:0 2px #000}
          #wp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);text-align:center;font:bold 17px system-ui;text-shadow:0 2px #000}
          #cr{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #fff;border-radius:50%}
          #msg{position:absolute;top:24%;width:100%;text-align:center;font:900 42px system-ui;text-shadow:0 3px #000}
          #dm{position:absolute;left:50%;top:57%;transform:translateX(-50%);font:bold 22px system-ui;color:#ff6;text-shadow:0 2px #000}
          #menu{position:fixed;inset:0;background:linear-gradient(#2b5cffdd,#a33bffdd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center;padding:12px}
          button{font:bold 20px system-ui;padding:14px 26px;border:0;border-radius:14px;background:#ffd23f;color:#222;box-shadow:0 5px #b88a00;touch-action:manipulation;cursor:pointer}
          h1{font-size:46px;margin:0;text-shadow:0 4px #0006}
          #tc{position:fixed;inset:0;z-index:5;display:none}
          .tb{position:absolute;border-radius:50%;background:#ffffff40;border:2px solid #fff9;color:#fff;font:bold 12px system-ui;padding:0;box-shadow:none}
          #tp{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:10px;display:none;gap:6px;pointer-events:auto;flex-wrap:wrap;max-width:70%}
          #tp button,#pb{font-size:13px;padding:6px 10px;box-shadow:0 3px #b88a00}
          #pb{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);pointer-events:auto}
          #menu{overflow:auto}
          #cv{position:fixed;inset:0;width:100%;height:100%;z-index:8;display:none}
          #menu.mm{flex-flow:row wrap;justify-content:center;align-content:flex-end;background:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
          #menu.mm h1{display:none}#menu.mm div{flex-basis:100%;font-size:13px;text-shadow:0 2px #000}
          #rot{position:fixed;inset:0;z-index:30;background:#123;display:none;align-items:center;justify-content:center;text-align:center;font:bold 24px system-ui;padding:20px}
          @media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
          #jb,#jk{position:absolute;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}
          #jb{width:110px;height:110px;border:2px solid #fff8;background:#fff2}#jk{width:48px;height:48px;background:#fffa}
          @media(max-height:480px){#menu{gap:6px}h1{font-size:28px}#menu button{font-size:15px;padding:8px 18px}#msg{font-size:30px;top:20%}.bar{height:12px}#sc{font-size:15px}#wp{font-size:14px}}
          </style></head><body>
          <div id=hud><div class=bar id=bA><i id=hA></i></div><div class=bar id=bE><i id=hB></i></div><div id=sc></div><div id=cr></div><div id=msg></div><div id=dm></div><div id=wp></div>
          <div id=tp><button onclick="act('KeyB')">+Bot</button><button onclick="act('KeyN')">-Bot</button><button onclick="act('KeyF')">Fight on/off</button><button onclick="act('KeyG')">Reset</button><button onclick="main()">Exit</button></div><button id=pb onclick="pause()">II</button></div>
          <svg id=cv viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id=cg x2=0 y2=1><stop offset=0 stop-color="#2b5cff"/><stop offset=.65 stop-color="#a33bff"/><stop offset=1 stop-color="#ff7a59"/></linearGradient></defs><rect width=800 height=450 fill="url(#cg)"/><polygon points="400,40 440,150 560,110 500,210 620,260 490,270 520,390 400,320 280,390 310,270 180,260 300,210 240,110 360,150" fill="#ffd23f" opacity=".95"/><g fill="#1b1f4b"><rect x=0 y=330 width=110 height=120/><rect x=100 y=370 width=90 height=80/><rect x=190 y=310 width=80 height=140/><rect x=530 y=340 width=100 height=110/><rect x=620 y=300 width=90 height=150/><rect x=700 y=360 width=100 height=90/></g><g transform="translate(230 240) rotate(-30)"><rect x=-28 y=-8 width=56 height=70 rx=26 fill="#2f7bff"/><circle cy=-32 r=30 fill="#ffe0bd"/><polygon points="-18,-54 18,-54 0,-92" fill="#ffd23f"/><circle cx=-10 cy=-34 r=4 fill="#111"/><circle cx=10 cy=-34 r=4 fill="#111"/><rect x=22 y=8 width=54 height=12 rx=3 fill="#222"/></g><g transform="translate(570 240) rotate(30) scale(-1 1)"><rect x=-28 y=-8 width=56 height=70 rx=26 fill="#ff4d4d"/><circle cy=-32 r=30 fill="#ffe0bd"/><polygon points="-18,-54 18,-54 0,-92" fill="#222"/><circle cx=-10 cy=-34 r=4 fill="#111"/><circle cx=10 cy=-34 r=4 fill="#111"/><rect x=22 y=8 width=54 height=12 rx=3 fill="#222"/></g><text x=400 y=135 text-anchor=middle font-size=86 font-weight=900 font-family="system-ui,sans-serif" fill="#fff" stroke="#1b1f4b" stroke-width=9 paint-order=stroke>CHAOS DUEL</text></svg><div id=tc></div><div id=menu></div><div id=rot>🔄<br>Rotate your phone to landscape to play</div>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          <script>
          const T=THREE,$=i=>document.getElementById(i),M=c=>new T.MeshLambertMaterial({color:c}),V=(x,y,z)=>new T.Vector3(x,y,z),touch='ontouchstart' in window;
          const R=new T.WebGLRenderer({antialias:!touch,powerPreference:'high-performance'});let pr=Math.min(devicePixelRatio,1.5),fa=0,fn=0;R.setPixelRatio(pr);R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
          const S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);S.background=new T.Color(0x7fd0ff);S.fog=new T.Fog(0x7fd0ff,90,300);
          S.add(new T.HemisphereLight(0xffffff,0x6a78a8,1.25));const DL=new T.DirectionalLight(0xffffff,.6);DL.position.set(10,30,12);S.add(DL);
          addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
          const G={m:'',run:0,pz:0,over:0,cd:0,t:0,d:1,inf:0},ST={s:0,h:0,hd:0},TC={n:1,hp:100,dmg:1,fight:1,bld:1},K={},E=[],SO=[],BK=new Map(),PJ=[],RC=new T.Raycaster(),PADS=[[0,-14],[0,14]],SP=[[-16,0],[16,0],[0,-17],[0,17],[-9,12],[9,-12]];
          let P,cy=0,cp=.1,shk=0,hm=0,dmT=0,mt=0,lb=0,AC,bt=0,fp=0,AR=45,SL=0,HC=0;const bf=()=>Math.max(52,Math.min(78,114.6*Math.atan(1.0913/C.aspect)));
          const W=[{n:'Pistol',d:14,k:7,r:.28,a:12,rt:1,pel:1,sp:.01},{n:'Shotgun',d:8,k:5.5,r:.85,a:6,rt:1.4,pel:8,sp:.1},{n:'Rifle',d:7,k:3,r:.1,a:30,rt:1.6,pel:1,sp:.03},{n:'Rocket',d:0,k:0,r:1.1,a:3,rt:2,pel:1,sp:0,rk:1}];
          /* audio */
          function snd(f,d,ty,v,e){const tn=performance.now();if(tn-SL<20)return;SL=tn;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,e),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(x){}}
          setInterval(()=>{if(!G.run||G.pz||!AC)return;bt++;const hot=E.some(e=>e.bot&&!e.dead&&Math.hypot(e.p.x-P.p.x,e.p.z-P.p.z)<14);if(bt%(hot?2:4)==0)snd([110,110,147,98][(bt>>2)&3],.2,'triangle',hot?.07:.04,50);if(hot&&bt%4==2)snd(800,.04,'square',.015,700)},150);
