          const PF=[];let pi=0;for(let i=0;i<150;i++){const m=new T.Mesh(new T.BoxGeometry(.22,.22,.22),new T.MeshBasicMaterial());m.visible=false;m.u={v:V(0,0,0),l:0,m:1};S.add(m);PF.push(m)}
